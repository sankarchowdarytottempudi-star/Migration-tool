# Migration-tool in k3s. The deploy script fills __SSH_TARGET__ and creates the two Secrets
# (mt-ssh = private key authorized on the host; mt-admin = the UI admin token).
apiVersion: v1
kind: Namespace
metadata: { name: migration-tool }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: migration-tool
  namespace: migration-tool
  labels: { app.kubernetes.io/name: migration-tool }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: migration-tool } }
  strategy: { type: Recreate }
  template:
    metadata:
      labels: { app.kubernetes.io/name: migration-tool }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      containers:
        - name: app
          image: migration-tool:vm
          imagePullPolicy: IfNotPresent
          ports: [ { name: http, containerPort: 8080 } ]
          env:
            - { name: MT_RUNNER, value: "ssh" }
            - { name: MT_SSH_TARGET, value: "__SSH_TARGET__" }
            - { name: MT_SSH_KEY, value: "/secrets/id_ed25519" }
            - { name: MT_PLATFORM_DIR, value: "/root/api-migration-platform" }
            - { name: MT_DATA_DIR, value: "/data" }
            - name: MT_ADMIN_TOKEN
              valueFrom: { secretKeyRef: { name: mt-admin, key: token } }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: ssh, mountPath: /secrets, readOnly: true }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
      volumes:
        - name: data
          hostPath: { path: /root/migration-tool-data, type: DirectoryOrCreate }
        - name: ssh
          secret: { secretName: mt-ssh, defaultMode: 0400 }
---
apiVersion: v1
kind: Service
metadata:
  name: migration-tool
  namespace: migration-tool
spec:
  type: NodePort
  selector: { app.kubernetes.io/name: migration-tool }
  ports:
    - { name: http, port: 80, targetPort: http, nodePort: 30900 }
